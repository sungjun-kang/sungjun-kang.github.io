<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실전 배당 복리 계산기 & 포트폴리오</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 5px solid #0b5e71;
            margin-bottom: 30px;
        }
        h1, h2 {
            text-align: center;
            color: #0b5e71;
            margin-bottom: 5px;
        }
        .info-text {
            text-align: center;
            color: #d35400;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* --- 포트폴리오 영역 추가 CSS --- */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .portfolio-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .portfolio-card h3 {
            font-size: 18px;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid #0b5e71;
            padding-bottom: 10px;
        }
        .portfolio-card input {
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .save-btn {
            background-color: #27ae60;
            margin-bottom: 0;
        }
        .save-btn:hover { background-color: #219653; }
        .calc-btn {
            background-color: #34495e;
            padding: 12px;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 0;
        }
        .calc-btn:hover { background-color: #2c3e50; }

        @media (max-width: 768px) {
            .portfolio-grid { grid-template-columns: 1fr; }
        }

        /* --- 기존 CSS --- */
        .chart-wrapper-outer {
            position: relative;
            width: 100%;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 30px;
        }
        .main-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .chart-inner-canvas {
            width: 3000px;
            height: 400px;
        }
        .y-axis-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 65px;
            height: calc(100% - 17px);
            background: rgba(255,255,255,0.95);
            border-right: 1px dashed #ccc;
            pointer-events: none;
            overflow: hidden;
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }
        .input-area {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: bold; color: #495057; margin-bottom: 5px; }
        input { padding: 12px 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; }
        .readonly-input { background-color: #e2e6ea; color: #c0392b; font-weight: bold; cursor: not-allowed; outline: none; }
        
        button {
            width: 100%; padding: 15px; background-color: #0b5e71; color: white;
            border: none; border-radius: 6px; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-bottom: 30px; transition: background 0.2s;
        }
        button:hover { background-color: #084655; }

        .table-container {
            max-height: 500px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px;
        }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid #dee2e6; }
        th { background-color: #0b5e71; color: white; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .tax-column { color: #e74c3c; font-weight: bold; }
        .krw-column { color: #27ae60; font-weight: bold; }
        .highlight-current { background-color: #fff3cd !important; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. 포트폴리오 관리 영역 -->
    <div class="container">
        <h2>📂 내 배당 포트폴리오</h2>
        <div class="portfolio-grid">
            <!-- 1, 4, 7, 10 그룹 -->
            <div class="portfolio-card">
                <h3>1, 4, 7, 10월</h3>
                <label>주식명</label>
                <input type="text" id="g1_name" value="알트리아">
                <label>보유 주식수</label>
                <input type="number" id="g1_shares" value="308">
                <label>1주당 배당금($)</label>
                <input type="number" id="g1_dps" value="0.98" step="0.01">
                <button class="calc-btn" onclick="sendToCalculator(1)">계산기로 보내기 ⬇️</button>
            </div>
            <!-- 2, 5, 8, 11 그룹 -->
            <div class="portfolio-card">
                <h3>2, 5, 8, 11월</h3>
                <label>주식명</label>
                <input type="text" id="g2_name" value="버라이존">
                <label>보유 주식수</label>
                <input type="number" id="g2_shares" value="360">
                <label>1주당 배당금($)</label>
                <input type="number" id="g2_dps" value="0.67" step="0.01">
                <button class="calc-btn" onclick="sendToCalculator(2)">계산기로 보내기 ⬇️</button>
            </div>
            <!-- 3, 6, 9, 12 그룹 -->
            <div class="portfolio-card">
                <h3>3, 6, 9, 12월</h3>
                <label>주식명</label>
                <input type="text" id="g3_name" value="SCHD">
                <label>보유 주식수</label>
                <input type="number" id="g3_shares" value="7">
                <label>1주당 배당금($)</label>
                <input type="number" id="g3_dps" value="0.75" step="0.01">
                <button class="calc-btn" onclick="sendToCalculator(3)">계산기로 보내기 ⬇️</button>
            </div>
        </div>
        <button class="save-btn" onclick="savePortfolio()">💾 포트폴리오 저장하기 (브라우저 캐시)</button>
    </div>

    <!-- 2. 기존 복리 계산기 영역 -->
    <div class="container" id="calculator-section">
        <h1>📉 선택 종목 배당 복리 계산기</h1>
        <div id="exchange-rate-info" class="info-text">💱 계산기 로딩 중...</div>

        <div class="input-area">
            <div class="input-group">
                <label>주식명</label>
                <input type="text" id="stockName" value="알트리아">
            </div>
            <div class="input-group">
                <label>현재 주식수 (주)</label>
                <input type="number" id="stockShares" value="308" oninput="updateQuarterlyTotal()">
            </div>
            <div class="input-group">
                <label>현재 주가 ($)</label>
                <input type="number" id="stockPrice" value="45.00">
            </div>
            <div class="input-group">
                <label>1주당 배당금 ($)</label>
                <input type="number" id="dps" value="0.98" oninput="updateQuarterlyTotal()" step="0.01">
            </div>
            <div class="input-group">
                <label>총 분기 배당금 (자동계산)</label>
                <input type="text" id="totalDiv" class="readonly-input" readonly>
            </div>
        </div>

        <button onclick="calculateDRIP()">계산 및 차트/표 업데이트 (세후 기준)</button>

        <div class="chart-wrapper-outer">
            <div class="main-scroll">
                <div class="chart-inner-canvas">
                    <canvas id="chartMain"></canvas>
                </div>
            </div>
            <div class="y-axis-overlay">
                <div class="chart-inner-canvas">
                    <canvas id="chartYAxis"></canvas>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>기간 (분기별)</th>
                        <th>주식명</th>
                        <th>주식수 (재투자)</th>
                        <th>세전 배당금 ($)</th>
                        <th class="tax-column">세후 배당금 ($)</th>
                        <th class="krw-column">원화 환산 (세후 ₩)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let myChartMain = null;
        let myChartYAxis = null;
        let usdToKrw = 1350;

        // --- 포트폴리오 저장 및 불러오기 로직 ---
        function savePortfolio() {
            const data = {
                g1: { name: document.getElementById('g1_name').value, shares: document.getElementById('g1_shares').value, dps: document.getElementById('g1_dps').value },
                g2: { name: document.getElementById('g2_name').value, shares: document.getElementById('g2_shares').value, dps: document.getElementById('g2_dps').value },
                g3: { name: document.getElementById('g3_name').value, shares: document.getElementById('g3_shares').value, dps: document.getElementById('g3_dps').value }
            };
            localStorage.setItem('myDividendPortfolio', JSON.stringify(data));
            alert('포트폴리오가 저장되었습니다! (브라우저를 닫아도 유지됩니다)');
        }

        function loadPortfolio() {
            const saved = localStorage.getItem('myDividendPortfolio');
            if(saved) {
                const data = JSON.parse(saved);
                document.getElementById('g1_name').value = data.g1.name || '';
                document.getElementById('g1_shares').value = data.g1.shares || '';
                document.getElementById('g1_dps').value = data.g1.dps || '';
                
                document.getElementById('g2_name').value = data.g2.name || '';
                document.getElementById('g2_shares').value = data.g2.shares || '';
                document.getElementById('g2_dps').value = data.g2.dps || '';
                
                document.getElementById('g3_name').value = data.g3.name || '';
                document.getElementById('g3_shares').value = data.g3.shares || '';
                document.getElementById('g3_dps').value = data.g3.dps || '';
            }
        }

        // 포트폴리오 카드의 데이터를 아래 메인 계산기로 쏘아주는 함수
        function sendToCalculator(groupNum) {
            document.getElementById('stockName').value = document.getElementById(`g${groupNum}_name`).value;
            document.getElementById('stockShares').value = document.getElementById(`g${groupNum}_shares`).value;
            document.getElementById('dps').value = document.getElementById(`g${groupNum}_dps`).value;
            
            updateQuarterlyTotal();
            calculateDRIP();
            
            // 클릭 시 계산기 영역으로 스크롤 부드럽게 이동
            document.getElementById('calculator-section').scrollIntoView({ behavior: 'smooth' });
        }

        // --- 기존 계산기 로직 ---
        function initApp() {
            loadPortfolio(); // 페이지 접속 시 저장된 포트폴리오 먼저 불러오기
            updateQuarterlyTotal();
            calculateDRIP();
            fetchExchangeRate();
        }

        function updateQuarterlyTotal() {
            let shares = parseFloat(document.getElementById('stockShares').value) || 0;
            let dps = parseFloat(document.getElementById('dps').value) || 0;
            document.getElementById('totalDiv').value = `$ ${(shares * dps).toFixed(2)}`;
        }

        async function fetchExchangeRate() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                usdToKrw = data.rates.KRW;
                document.getElementById('exchange-rate-info').innerHTML = `💱 실시간 환율 적용 완료: <strong>1 USD = ${usdToKrw.toLocaleString('ko-KR', {maximumFractionDigits: 2})} 원</strong> (배당세 15% 공제 기준)`;
                calculateDRIP(); 
            } catch (error) {
                document.getElementById('exchange-rate-info').innerHTML = `💱 실시간 환율 호출 지연 (기본 환율 1,350원 적용 중)`;
            }
        }

        function calculateDRIP() {
            const name = document.getElementById('stockName').value;
            const initialShares = parseFloat(document.getElementById('stockShares').value);
            const price = parseFloat(document.getElementById('stockPrice').value);
            const dps = parseFloat(document.getElementById('dps').value);

            if (!name || isNaN(initialShares) || isNaN(price) || isNaN(dps)) {
                return;
            }

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 

            let chartLabels = [];
            let chartDataNet = [];
            let runningShares = initialShares;

            for (let i = 1; i <= 120; i++) {
                let grossDiv = runningShares * dps; 
                let netDiv = grossDiv * 0.85;       
                let krwDiv = netDiv * usdToKrw;     
                
                let year = Math.ceil(i / 4);
                let quarter = i % 4 === 0 ? 4 : i % 4;
                let labelName = `${year}년차 ${quarter}Q`;
                let rowClass = "";

                if (i === 1) { labelName = "현재 분기"; rowClass = "highlight-current"; } 
                else if (i === 2) { labelName = "다음 예상분기"; }

                chartLabels.push(i === 1 ? "현재" : i === 2 ? "다음" : `${year}년 ${quarter}Q`);
                chartDataNet.push(netDiv);

                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td>${labelName}</td>
                        <td>${name}</td>
                        <td>${runningShares.toFixed(2)}주</td>
                        <td>$${grossDiv.toFixed(2)}</td>
                        <td class="tax-column">$${netDiv.toFixed(2)}</td>
                        <td class="krw-column">₩${Math.round(krwDiv).toLocaleString()}</td>
                    </tr>
                `;

                runningShares += (netDiv / price);
            }
            drawDualCharts(chartLabels, chartDataNet);
        }

        function drawDualCharts(labels, dataNet) {
            const ctxMain = document.getElementById('chartMain').getContext('2d');
            const ctxYAxis = document.getElementById('chartYAxis').getContext('2d');

            if (myChartMain) myChartMain.destroy();
            if (myChartYAxis) myChartYAxis.destroy();

            const maxVal = Math.max(...dataNet) * 1.1;

            const commonOptions = {
                responsive: true, maintainAspectRatio: false, animation: false,
                layout: { padding: { top: 20, right: 20, bottom: 10, left: 10 } },
                plugins: { legend: { display: false } }
            };

            myChartMain = new Chart(ctxMain, {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: dataNet, backgroundColor: '#0b5e71', borderRadius: 3 }] },
                options: {
                    ...commonOptions,
                    scales: {
                        x: { display: true },
                        y: { display: true, beginAtZero: true, max: maxVal, ticks: { color: 'transparent' } }
                    },
                    plugins: {
                        ...commonOptions.plugins,
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let usd = context.raw; let krw = usd * usdToKrw;
                                    return ` 세후: $${usd.toLocaleString(undefined, {minimumFractionDigits: 2})} (약 ₩${Math.round(krw).toLocaleString()})`;
                                }
                            }
                        }
                    }
                }
            });

            myChartYAxis = new Chart(ctxYAxis, {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: dataNet, backgroundColor: 'transparent' }] },
                options: {
                    ...commonOptions,
                    scales: {
                        x: { display: true, ticks: { color: 'transparent' }, grid: { display: false } },
                        y: { display: true, beginAtZero: true, max: maxVal, ticks: { callback: function(v) { return '$' + v.toLocaleString(); } } }
                    },
                    plugins: { ...commonOptions.plugins, tooltip: { enabled: false } }
                }
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
